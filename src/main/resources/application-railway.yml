spring:
  datasource:
    url: jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: ${MYSQLUSER}
    password: ${MYSQLPASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        format_sql: false
        generate_statistics: false

logging:
  level:
    root: INFO
    com.pulse: INFO

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto

seoul-api:
  key: ${SEOUL_API_KEY}
  base-url: ${SEOUL_API_BASE_URL}
  page-size: 1000
  services:
    subway: CardSubwayTime

seoul-metro-api:
  key: ${SEOUL_METRO_API_KEY}
  base-url: ${SEOUL_METRO_API_BASE_URL}
  data-type: JSON
  num-of-rows: 1000

odsay-api:
  key: ${ODSAY_API_KEY}
  base-url: ${ODSAY_API_BASE_URL}
  display-count: 10

kakao-api:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: ${KAKAO_REDIRECT_URI}

google-api:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-seconds: 3600
  refresh-token-expiration-seconds: 2592000

master-data:
  lines-path: file:/app/data/lines.json
  stations-path: file:/app/data/stations.json
